version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - test -f .env.aws && cp .env.aws .env || echo "No .env.aws found, using defaults"
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
      envs:
        # Set this env var at the Amplify Console under Build settings -> Environment variables
        # to point to your AWS backend URL
        VITE_API_BASE_URL: placeholder
